name: Build
on:
  pull_request:
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - run: npm run lint:js
    - run: npm run build
    - name: PHP syntax check
      run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
